repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Python lint/format: single source of truth is `make ci-lint` in the Makefile
  # (Black --check + Flake8 on app/ and tests/), same as .github/workflows/python_lint.yml
  - repo: local
    hooks:
      - id: make-ci-lint
        name: make ci-lint
        entry: make ci-lint
        language: system
        pass_filenames: false
        always_run: true
